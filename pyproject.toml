[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gutshaus-finder"
version = "0.2.0"
description = "Find former manor-house sites in Poland and rank them for building a new house, from open data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["gis", "poland", "heritage", "manor", "openstreetmap", "cadastre"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "requests>=2.31",
  "shapely>=2.0",
  "pyproj>=3.5",
  "geopandas>=0.14",
  "pyogrio>=0.7",
  "truststore>=0.9",
  "osmium>=4.0",
  "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/kygobae/manormap"
Issues = "https://github.com/kygobae/manormap/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gutshaus = "gutshaus.cli:main"

[tool.setuptools.packages.find]
include = ["gutshaus*"]

[tool.setuptools.package-data]
gutshaus = ["*.html", "deploy/*", "deploy/functions/*"]
