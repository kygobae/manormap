<!doctype html>
<!-- Source of og.png (1200x630 link preview). Render: open in a browser at 1200x630 and screenshot, e.g.
     msedge --headless --window-size=1200,630 --allow-file-access-from-files --screenshot=og.png og_source.html -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Fraunces";font-weight:400 700;src:url(../fonts/fraunces-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"Fraunces";font-weight:400 700;src:url(../fonts/fraunces-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02AF}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#e8ece6;font-family:"Segoe UI",system-ui,sans-serif;color:#18201c;position:relative}
svg.map{position:absolute;inset:0}
.panel{position:absolute;left:64px;top:64px;width:600px;padding:44px 48px;background:rgba(250,251,250,.9);border:1px solid rgba(24,32,28,.12);border-radius:28px;box-shadow:0 18px 60px rgba(24,32,28,.18)}
h1{margin:0;font:600 84px/1 "Fraunces",Georgia,serif;color:#245b4a;letter-spacing:-1px}
.sub{margin:10px 0 0;font:600 30px/1.2 "Fraunces",Georgia,serif;color:#5d6963}
.lines{margin:30px 0 0;font-size:25px;line-height:1.5;color:#18201c}
.lines span{color:#5d6963}
.grades{display:flex;gap:12px;margin-top:30px}
.g{width:58px;height:58px;border-radius:16px;color:#fff;font:800 32px/58px "Segoe UI",sans-serif;text-align:center}
.url{position:absolute;right:56px;bottom:44px;font:700 30px/1 "Segoe UI",sans-serif;color:#245b4a;background:rgba(250,251,250,.92);padding:14px 22px;border-radius:16px}
</style></head><body>
<svg class="map" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#e9dfc4"/><line x1="0" y1="0" x2="0" y2="9" stroke="#a08a60" stroke-width="1.4"/></pattern>
    <clipPath id="then"><rect x="0" y="0" width="800" height="630"/></clipPath>
  </defs>
  <!-- today -->
  <rect width="1200" height="630" fill="#e8ece6"/>
  <rect x="700" y="60" width="260" height="150" rx="6" fill="#dfe6d8"/><rect x="980" y="300" width="220" height="140" rx="6" fill="#dfe6d8"/>
  <circle cx="930" cy="360" r="120" fill="#cfdcc8"/><circle cx="1050" cy="160" r="90" fill="#cfdcc8"/>
  <path d="M-20,540 C200,480 380,560 560,470 S880,330 1220,380" fill="none" stroke="#9dbccb" stroke-width="14" stroke-linecap="round"/>
  <path d="M0,300 C300,280 520,240 760,270 S1050,300 1200,260" fill="none" stroke="#fff" stroke-width="9"/>
  <path d="M860,0 C880,180 840,380 900,630" fill="none" stroke="#fff" stroke-width="9"/>
  <!-- then (Messtischblatt look), left of the line -->
  <g clip-path="url(#then)" opacity=".55">
    <rect width="1200" height="630" fill="#efe4c8"/>
    <circle cx="930" cy="360" r="120" fill="url(#hatch)"/>
    <path d="M-20,540 C200,480 380,560 560,470 S880,330 1220,380" fill="none" stroke="#6d8f8f" stroke-width="5"/>
    <path d="M0,300 C300,280 520,240 760,270 S1050,300 1200,260" fill="none" stroke="#6b5233" stroke-width="3"/>
  </g>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#7a5a2e" stroke-width="4"/>
  <circle cx="800" cy="440" r="24" fill="#7a5a2e" stroke="#fff" stroke-width="4"/>
  <!-- the manor -->
  <g transform="translate(985,330)">
    <path d="M-120,90 V20 L-60,-16 L-60,-28 L-44,-28 L-44,-24 L0,-48 L44,-24 L44,-28 L60,-28 L60,-16 L120,20 V90 Z" fill="#fbfaf6" stroke="#245b4a" stroke-width="5" stroke-linejoin="round"/>
    <g fill="#245b4a" opacity=".75"><rect x="-90" y="34" width="16" height="24"/><rect x="-50" y="34" width="16" height="24"/><rect x="34" y="34" width="16" height="24"/><rect x="74" y="34" width="16" height="24"/></g>
    <rect x="-12" y="52" width="24" height="38" fill="#245b4a"/>
  </g>
  <!-- grade chips on the map -->
  <g font-family="Segoe UI" font-weight="800" font-size="22">
    <g transform="translate(1110,450)"><rect x="-38" y="-20" width="76" height="40" rx="20" fill="#fff" stroke="rgba(0,0,0,.15)"/><path d="M-26,10 V-3 L-16,-11 L-6,-3 V10 Z" fill="#1f7a52"/><text x="12" y="8" text-anchor="middle" fill="#1f7a52">A</text></g>
    <g transform="translate(1110,90)"><rect x="-38" y="-20" width="76" height="40" rx="20" fill="#fff" stroke="rgba(0,0,0,.15)"/><path d="M-26,10 V-1 L-21,-8 L-17,-2 L-12,-9 L-8,-2 L-6,10 Z" fill="#d39b2a"/><text x="12" y="8" text-anchor="middle" fill="#d39b2a">C</text></g>
  </g>
</svg>
<div class="panel">
  <h1>ManorMap</h1>
  <p class="lines">Gutshäuser in Polen <span>·</span> Dwory i pałace w Polsce<br><span>Manor houses in Poland – preserve, rebuild, revive</span></p>
  <div class="grades"><div class="g" style="background:#1f7a52">A</div><div class="g" style="background:#6aa55b">B</div><div class="g" style="background:#d39b2a">C</div><div class="g" style="background:#9aa19d">D</div></div>
</div>
<div class="url">manormap.eu</div>
</body></html>
