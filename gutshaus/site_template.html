<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManorMap</title>
<meta name="description" content="Ehemalige Gutshäuser in Polen: Standorte und Noten für Neubau und Sanierung. Dawne dwory i pałace w Polsce. Former manor sites in Poland.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ink:#1d2321;--muted:#6b736f;--line:#e2e0da;--bg:#faf8f4;--accent:#7a4b2a;
  --A:#1a6b3c;--B:#4c9a5b;--C:#d39b2a;--D:#9aa19d}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:#fff}
header h1{font:600 19px Georgia,serif;margin:0;color:var(--accent)}
header .tag{color:var(--muted);font-size:13px;flex:1}
.lang button{border:1px solid var(--line);background:#fff;padding:3px 8px;cursor:pointer;font-size:12px;border-radius:4px}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 56px)}
aside{overflow:auto;border-right:1px solid var(--line);background:#fff}
#map{height:100%}
.box{padding:14px 16px;border-bottom:1px solid var(--line)}
.box h2{font:600 15px Georgia,serif;margin:0 0 6px;color:var(--accent)}
input[type=search],select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font:inherit;margin-bottom:6px}
.mode{display:flex;margin:2px 0 8px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mode button{flex:1;border:0;background:#fff;padding:6px;cursor:pointer;font:inherit;font-size:13px}
.mode button.on{background:var(--accent);color:#fff}
.gl{font-size:11px;color:var(--muted);margin-left:2px}
.grades label{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:13px}
.g{display:inline-block;min-width:22px;text-align:center;color:#fff;font-weight:700;border-radius:4px;padding:0 5px;font-size:13px}
.gA{background:var(--A)}.gB{background:var(--B)}.gC{background:var(--C)}.gD{background:var(--D)}
#list{list-style:none;margin:0;padding:0}
#list li{padding:8px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center}
#list li:hover{background:var(--bg)}
#list .n{flex:1}#list .de{color:var(--muted);font-size:12px}
.small{font-size:12px;color:var(--muted)}
.site{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.site .s{flex:1}
.buy,.leaflet-popup-content a.buy{background:var(--accent);color:#fff;text-decoration:none;padding:4px 9px;border-radius:5px;font-size:12px;white-space:nowrap}
.buy:hover{filter:brightness(1.1)}
.teaser{margin-top:6px;padding-top:5px;border-top:1px solid var(--line)}
ul.inc{margin:4px 0 0;padding-left:18px;font-size:13px}
footer{font-size:11.5px;color:var(--muted);padding:12px 16px}
footer a,.box a{color:var(--accent)}
.leaflet-popup-content{min-width:260px}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}#map{height:55vh}aside{order:2}}
</style>
</head>
<body>
<header>
  <h1 id="title">ManorMap</h1>
  <span class="tag" data-t="tagline"></span>
  <span class="lang"><button data-l="de">DE</button><button data-l="pl">PL</button><button data-l="en">EN</button></span>
</header>
<main>
<aside>
  <div class="box">
    <h2 data-t="whatH"></h2>
    <div data-t="what" class="small"></div>
  </div>
  <div class="box">
    <input type="search" id="q" data-tp="search">
    <select id="vv"><option value="" data-t="allRegions"></option></select>
    <div class="mode" id="mode"><button data-m="new"></button><button data-m="renovation"></button></div>
    <div class="grades" id="grades"></div>
    <div class="small" id="count"></div>
  </div>
  <ul id="list"></ul>
  <div class="box" id="shop">
    <h2 data-t="dossierH"></h2>
    <div class="small" data-t="dossier"></div>
    <ul class="inc" data-t="includes"></ul>
    <p class="small" data-t="notIncluded"></p>
    <p id="sample"></p>
  </div>
  <div class="box">
    <h2 data-t="gradesH"></h2>
    <div class="small" data-t="gradesText"></div>
  </div>
  <footer>
    <span data-t="sources"></span><br>
    <span data-t="optout"></span> <a id="mail"></a> · <a href="legal.html" data-t="legal"></a>
  </footer>
</aside>
<div id="map"></div>
</main>
<script>
const D = /*__DATA__*/null;
const C = D.cfg;
const T = {
 de:{tagline:"Ehemalige Gutshäuser in Polen – neu bauen, wo das Herrenhaus stand, oder retten, was übrig ist",
  whatH:"Worum es geht",
  what:"Nach 1945 verfielen in Polen Tausende Gutshäuser. Wir kombinieren historische Karten, das Denkmalregister, Luftbilder und Infrastrukturdaten und bewerten jeden Standort für einen Neubau und für eine Sanierung. Punkte zeigen die genaue Lage; ein Kreis heißt: nur das Dorf ist bekannt.",whatShop:" Flurstück, Karten und alle Daten stehen im Dossier.",
  search:"Dorf suchen (polnisch oder deutsch) …",allRegions:"Alle Woiwodschaften",sites:"Standorte",villages:"Dörfer",
  dossierH:"Das Standort-Dossier",dossier:"Automatisch erstellt, als PDF sofort nach dem Kauf. Auf Deutsch mit polnischer Zusammenfassung für Gemeinde, Notar oder Architekt.",
  includes:"<li>genaue Lage, Flurstücksnummer und -fläche</li><li>Luftbild und LiDAR-Relief mit Flurstücksgrenze</li><li>Leitungskarte; Entfernung zu Strom, Straße, Nachbarn, Wasser</li><li>Naturschutz, Flächennutzung, Denkmalregister</li><li>staatliches Verkaufsangebot (KOWR), falls vorhanden</li><li>Note mit Begründung und Checkliste der nächsten Schritte</li><li>Fördermöglichkeiten: Zuschüsse des Denkmalpflegers, des Kulturministeriums, der Woiwodschaft und der Gemeinde</li>",
  notIncluded:"Nicht enthalten: Bebauungsplan / WZ, Grundbuch, Auflagen des Denkmalpflegers, Anschlussbedingungen. Das Dossier sagt Ihnen, wo und wie Sie das prüfen.",
  sample:"Beispiel-Dossier ansehen (PDF)",gradesH:"Die Noten",
  gradesText:"Zwei Noten pro Standort. <b>Neubau</b>: Das Herrenhaus ist verschwunden, Sie bauen an seiner Stelle neu. <b>Sanierung</b>: Sie retten, was steht – Ruine oder Gebäude; der Denkmaleintrag zählt hier positiv, weil nur dann Zuschüsse möglich sind. <b>A</b> sehr gute Ausgangslage · <b>B</b> gut · <b>C</b> mit Einschränkungen · <b>D</b> schwierig.",
  mNew:"Neubau",mRen:"Sanierung",buy:"Dossier",kowr:"Staatliches Verkaufsangebot (KOWR)",tender:"Ausschreibung",openCard:"Angebot öffnen",
  park:"Park",reg:"Denkmal",hist:"Historische Karte (Messtischblatt)",forSale:"zum Verkauf",
  status:{lost:"Herrenhaus verschwunden",ruin:"Ruine",standing:"Gebäude steht",unlocated:"Lage im Dorf unklar",unknown:"unklar"},
  sources:"Daten: © OpenStreetMap-Mitwirkende (ODbL), Narodowy Instytut Dziedzictwa, GUGiK/Geoportal, GDOŚ, KOWR. Historische Karten: IH PAN / pastmaps (CC BY-NC).",
  optout:"Eigentümer, die nicht genannt werden möchten, schreiben an",legal:"Impressum & Datenschutz",ask:"Anfragen",
  approx:"Lage nur auf Dorfebene bekannt – suchen Sie den Gutshof auf dem Messtischblatt.",
  private:"Das Gebäude steht und ist meist bewohnt: Privatbesitz, bitte nur mit Erlaubnis betreten.",
  teaser:"Standort-Dossier (bald verfügbar): Flurstück und Fläche, Luftbild, LiDAR- und Leitungskarte mit Flurstücksgrenze, Entfernungen, Schutzgebiete, Förderung und Checkliste mit polnischer Zusammenfassung."},
 pl:{tagline:"Dawne dwory i pałace w Polsce – zbudować nowy dom w miejscu dworu albo uratować to, co zostało",
  whatH:"O co chodzi",
  what:"Po 1945 r. tysiące dworów w Polsce popadło w ruinę. Łączymy mapy historyczne, rejestr zabytków, ortofotomapy i dane o infrastrukturze i oceniamy każde miejsce pod kątem budowy nowego domu i remontu. Punkty pokazują dokładną lokalizację; okrąg oznacza, że znana jest tylko wieś.",whatShop:" Działka, mapy i wszystkie dane są w raporcie.",
  search:"Szukaj wsi (polska lub niemiecka nazwa) …",allRegions:"Wszystkie województwa",sites:"miejsc",villages:"wsi",
  dossierH:"Raport o lokalizacji",dossier:"Generowany automatycznie, PDF od razu po zakupie. Po niemiecku, z podsumowaniem po polsku dla gminy, notariusza lub architekta.",
  includes:"<li>dokładna lokalizacja, numer i powierzchnia działki</li><li>ortofotomapa i cieniowanie LiDAR z granicą działki</li><li>mapa uzbrojenia; odległość do linii energetycznej, drogi, sąsiadów, wody</li><li>ochrona przyrody, użytkowanie terenu, rejestr zabytków</li><li>oferta KOWR, jeśli istnieje</li><li>ocena z uzasadnieniem i lista kolejnych kroków</li><li>możliwości dofinansowania: dotacje konserwatora, ministerstwa, województwa i gminy</li>",
  notIncluded:"Raport nie obejmuje: MPZP / WZ, księgi wieczystej, wymagań konserwatora, warunków przyłączenia. Wskazuje, gdzie i jak to sprawdzić.",
  sample:"Przykładowy raport (PDF)",gradesH:"Oceny",
  gradesText:"Dwie oceny dla każdego miejsca. <b>Budowa</b>: dworu już nie ma, budujesz nowy dom w jego miejscu. <b>Remont</b>: ratujesz to, co stoi – ruinę lub budynek; wpis do rejestru zabytków liczy się tu na plus, bo tylko wtedy możliwe są dotacje. <b>A</b> bardzo dobre warunki · <b>B</b> dobre · <b>C</b> z ograniczeniami · <b>D</b> trudne.",
  mNew:"Budowa",mRen:"Remont",buy:"Raport",kowr:"Oferta sprzedaży KOWR",tender:"Przetarg",openCard:"Otwórz ofertę",
  park:"park",reg:"zabytek",hist:"Mapa historyczna (Messtischblatt)",forSale:"na sprzedaż",
  status:{lost:"dwór nie istnieje",ruin:"ruina",standing:"budynek istnieje",unlocated:"lokalizacja we wsi niepewna",unknown:"nieustalony"},
  sources:"Dane: © współtwórcy OpenStreetMap (ODbL), Narodowy Instytut Dziedzictwa, GUGiK/Geoportal, GDOŚ, KOWR. Mapy historyczne: IH PAN / pastmaps (CC BY-NC).",
  optout:"Właściciele, którzy nie chcą być wymienieni, mogą napisać na",legal:"Nota prawna i prywatność",ask:"Zapytaj",
  approx:"Lokalizacja znana tylko na poziomie wsi – szukaj folwarku na mapie Messtischblatt.",
  private:"Budynek istnieje i zwykle jest zamieszkany: własność prywatna, wejście tylko za zgodą właściciela.",
  teaser:"Raport o lokalizacji (wkrótce): działka i powierzchnia, ortofotomapa, mapa LiDAR i uzbrojenia z granicą działki, odległości, ochrona przyrody, dotacje i lista kontrolna."},
 en:{tagline:"Former manor houses in Poland – build where the manor stood, or save what is left",
  whatH:"What this is",
  what:"After 1945 thousands of manor houses in Poland fell into ruin. We combine historical maps, the monument register, aerial imagery and infrastructure data and rate every site for a new build and for renovation. Dots show the exact site; a ring means only the village is known.",whatShop:" The parcel, maps and all data are in the dossier.",
  search:"Search village (Polish or German name) …",allRegions:"All voivodeships",sites:"sites",villages:"villages",
  dossierH:"The site dossier",dossier:"Generated automatically, PDF right after purchase. In German with a Polish summary for the municipality, notary or architect.",
  includes:"<li>exact location, parcel number and area</li><li>aerial photo and LiDAR relief with the parcel outline</li><li>utility map; distance to power line, road, neighbours, water</li><li>nature protection, land use, monument register</li><li>state sale offer (KOWR), if any</li><li>grade with explanation and a checklist of next steps</li><li>funding options: grants from the heritage conservator, the ministry of culture, the voivodeship and the municipality</li>",
  notIncluded:"Not included: zoning plan / WZ, land register, conservator requirements, utility connection terms. The dossier tells you where and how to check them.",
  sample:"See a sample dossier (PDF)",gradesH:"Grades",
  gradesText:"Two grades per site. <b>New build</b>: the manor is gone and you build a new house in its place. <b>Renovation</b>: you save what stands – a ruin or a building; a register entry counts in favour here, because only then are subsidies possible. <b>A</b> very good starting point · <b>B</b> good · <b>C</b> with limitations · <b>D</b> difficult.",
  mNew:"New build",mRen:"Renovation",buy:"Dossier",kowr:"State sale offer (KOWR)",tender:"Tender",openCard:"Open offer",
  park:"park",reg:"listed",hist:"Historical map (Messtischblatt)",forSale:"for sale",
  status:{lost:"manor gone",ruin:"ruin",standing:"building stands",unlocated:"position in village unclear",unknown:"unclear"},
  sources:"Data: © OpenStreetMap contributors (ODbL), National Heritage Institute (NID), GUGiK/Geoportal, GDOŚ, KOWR. Historical maps: IH PAN / pastmaps (CC BY-NC).",
  optout:"Owners who do not want to be listed, write to",legal:"Legal notice & privacy",ask:"Ask",
  approx:"Location known only at village level – look for the estate on the Messtischblatt.",
  private:"The building stands and is usually lived in: private property, please visit only with permission.",
  teaser:"Site dossier (coming soon): parcel and area, aerial, LiDAR and utility maps with the parcel outline, distances, nature protection, funding and a checklist with a Polish summary."}
};
let lng = (()=>{try{return localStorage.getItem("lang")}catch(e){return null}})()
  || (navigator.language||"de").slice(0,2);
if(!T[lng]) lng = "en";
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t = k => T[lng][k];
const VV = D.villages;
const COL = {A:"#1a6b3c",B:"#4c9a5b",C:"#d39b2a",D:"#9aa19d"};
const shown = new Set(["A","B","C"]);
let mode = "new";
const vg = v => mode === "new" ? v.g : v.r;

function buyUrl(id){
  if(!C.checkout) return C.email ? `mailto:${C.email}?subject=Dossier%20${id}` : "#";
  return C.checkout + (C.checkout.includes("?")?"&":"?") + "checkout[custom][dossier]=" + encodeURIComponent(id)
         + "&checkout[locale]=" + lng;
}
const sg = s => mode === "new" ? s.grade : s.ren;           // a site's grade in the current mode
function popup(v, sites){
  let h = `<b>${esc(v.v)}</b>${v.de?` <span class="small">(${esc(v.de)})</span>`:""}<br>
    <span class="small">gm. ${esc(v.gm)} · pow. ${esc(v.pw)}</span>`;
  if(!sites[0].lat) h += `<div class="small"><i>${esc(t("approx"))}</i></div>`;
  for(const s of sites){
    const tags = [t("status")[s.status]||s.status, s.park?t("park"):"", s.registered?t("reg"):"", s.kowr?t("forSale"):""].filter(Boolean).join(" · ");
    h += `<div class="site"><span title="${esc(t("mNew"))}" class="g g${s.grade}">${s.grade}</span><span title="${esc(t("mRen"))}" class="g g${s.ren}">${s.ren}</span><span class="s">${esc(tags)}</span>
      ${C.shop ? `<a class="buy" href="${esc(buyUrl(s.id))}" target="_blank" rel="noopener">${t("buy")} ${esc(C.price)}</a>` : ""}</div>`;
    if(s.status === "standing") h += `<div class="small">${esc(t("private"))}</div>`;
  }
  h += `<div class="small">${esc(t("mNew"))} · ${esc(t("mRen"))}${C.shop ? "<br>" + esc(sites.map(s=>s.id).join(", ")) : ""}</div>`;
  if(!C.shop) h += `<div class="small teaser">${esc(t("teaser"))}</div>`;
  return h;
}

const map = window.L.map("map", {preferCanvas:true}).setView([52.1, 19.2], 6);
const wms = (url, layers, o={}) => window.L.tileLayer.wms(url, Object.assign({layers, format:"image/png", transparent:true, version:"1.1.1"}, o));
const topo = wms("https://mapy.geoportal.gov.pl/wss/service/img/guest/TOPO/MapServer/WMSServer","Raster",{transparent:false, attribution:"GUGiK / Geoportal"}).addTo(map);
const ortho = wms("https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution","Raster",{transparent:false, attribution:"GUGiK / Geoportal"});
const mtb = wms("https://pastmaps.cenagis.edu.pl/geoserver/ihpan/wms","m25k_3857",{transparent:false, attribution:"IH PAN, pastmaps (CC BY-NC)"});
const layers = {};
const markers = window.L.layerGroup().addTo(map);
const kowrLayer = window.L.layerGroup().addTo(map);
function ctl(){
  if(map._ctl) map.removeControl(map._ctl);
  map._ctl = window.L.control.layers({"Geoportal TOPO":topo, "Orthophoto":ortho, [t("hist")]:mtb},
                                     {[t("kowr")]:kowrLayer}).addTo(map);
}
for(const o of D.kowr){
  window.L.marker([o.lat,o.lon], {title:o.t, icon: window.L.divIcon({className:"", html:'<div style="background:#7a4b2a;color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;font:700 14px/24px sans-serif;border:2px solid #fff">€</div>', iconSize:[24,24]})})
   .bindPopup(() => `<b>${esc(o.t)}</b><br>${esc(t("kowr"))}<br>${o.ha?esc(o.ha)+" ha · ":""}${o.tender?esc(t("tender"))+": "+esc(o.tender):""}<br><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(t("openCard"))}</a>`)
   .addTo(kowrLayer);
}

const vvSel = document.getElementById("vv");
[...new Set(VV.map(v=>v.vv).filter(Boolean))].sort().forEach(v => vvSel.add(new Option(v, v)));
const gradesEl = document.getElementById("grades");
for(const g of "ABCD"){
  const lab = document.createElement("label");
  lab.innerHTML = `<input type="checkbox" ${shown.has(g)?"checked":""}> <span class="g g${g}">${g}</span>`;
  lab.querySelector("input").onchange = e => { e.target.checked ? shown.add(g) : shown.delete(g); render(); };
  gradesEl.appendChild(lab);
}
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ł/g,"l");
function render(){
  const q = norm(document.getElementById("q").value), vv = vvSel.value;
  const list = VV.filter(v => v.sites.some(s => shown.has(sg(s))) && (!vv || v.vv===vv) && (!q || norm(v.v).includes(q) || norm(v.de).includes(q)));
  markers.clearLayers();
  let n = 0;
  for(const v of list){
    const sites = v.sites.filter(s => shown.has(sg(s)));
    n += sites.length;
    let first = null;
    for(const s of sites.filter(s => s.lat)){              // located: a dot at the exact site
      const m = window.L.circleMarker([s.lat,s.lon], {radius: 6, color:"#fff", weight:1.5, fillColor:COL[sg(s)], fillOpacity:.95})
        .bindPopup(() => popup(v, [s])).addTo(markers);
      first = first || m;
    }
    const approx = sites.filter(s => !s.lat);               // known only by village: a ring around the village
    if(approx.length){
      const best = approx.map(sg).sort()[0];
      const m = window.L.circleMarker([v.lat,v.lon], {radius: 9, color:COL[best], weight:3, dashArray:"3 3", fillOpacity:0})
        .bindPopup(() => popup(v, approx)).addTo(markers);
      first = first || m;
    }
    layers[v.v+v.gm] = first;
  }
  document.getElementById("count").textContent = `${list.length} ${t("villages")} · ${n} ${t("sites")}`;
  const ul = document.getElementById("list"); ul.innerHTML = "";
  list.sort((a,b) => vg(a).localeCompare(vg(b)) || a.v.localeCompare(b.v));
  for(const v of list.slice(0, 200)){
    const li = document.createElement("li");
    li.innerHTML = `<span class="g g${vg(v)}">${vg(v)}</span><span class="n">${esc(v.v)} ${v.de?`<span class="de">${esc(v.de)}</span>`:""}<br><span class="small">${esc(v.pw)}</span></span><span class="small">${v.sites.length}</span>`;
    li.onclick = () => { const m = layers[v.v+v.gm]; map.setView(m.getLatLng(), 15); m.openPopup(); };
    ul.appendChild(li);
  }
}
function lang(l){
  lng = l; try{localStorage.setItem("lang", l)}catch(e){}
  document.documentElement.lang = l;
  const name = l === "de" ? (C.name_de || C.name) : C.name;  // German product name on the German site
  document.getElementById("title").textContent = name; document.title = name;
  document.querySelectorAll("[data-t]").forEach(e => e.innerHTML = t(e.dataset.t));
  if(C.shop) document.querySelectorAll('[data-t="what"]').forEach(e => e.innerHTML += t("whatShop"));
  document.querySelectorAll("[data-tp]").forEach(e => e.placeholder = t(e.dataset.tp));
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l===l));
  document.getElementById("shop").hidden = !C.shop;
  document.getElementById("sample").innerHTML = C.sample ? `<a href="sample.pdf" target="_blank">${t("sample")}</a>` : "";
  const mail = document.getElementById("mail"); mail.textContent = C.email; mail.href = "mailto:"+C.email;
  document.querySelectorAll("#mode button").forEach(b => { b.textContent = t(b.dataset.m==="new"?"mNew":"mRen"); b.classList.toggle("on", b.dataset.m===mode); });
  ctl(); render(); map.closePopup();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => lang(b.dataset.l));
document.getElementById("q").oninput = render;
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => {
  mode = b.dataset.m; document.querySelectorAll("#mode button").forEach(x => x.classList.toggle("on", x===b)); render(); });
vvSel.onchange = render;
document.getElementById("title").textContent = C.name;
// #lat,lon,zoom[,messtischblatt|ortho] (links from dossiers)
function fromHash(){
  const p = location.hash.slice(1).split(",");
  if(p.length >= 3 && !isNaN(+p[0])){
    map.setView([+p[0], +p[1]], +p[2]);
    if(p[3]==="messtischblatt"){ map.removeLayer(topo); map.removeLayer(ortho); mtb.addTo(map); }
    if(p[3]==="ortho"){ map.removeLayer(topo); map.removeLayer(mtb); ortho.addTo(map); }
  }
}
lang(lng); fromHash(); window.addEventListener("hashchange", fromHash);
