<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<style>
/* Modern strategy: a full-screen map with floating glass panels; the serif only for places, icons for the manor's state. */
@font-face{font-family:"Fraunces";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(fonts/fraunces-latin-wght-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Fraunces";font-style:normal;font-weight:400 700;font-display:swap;
  src:url(fonts/fraunces-latin-ext-wght-normal.woff2) format("woff2");
  unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --ink:#18201c; --muted:#5d6963; --line:rgba(24,32,28,.12); --glass:rgba(250,251,250,.84); --solid:#fbfcfb; --hover:rgba(36,91,74,.07);
  --accent:#245b4a; --on-accent:#fff; --sale:#245b8f; --sale-bg:#eaf1f8; --past:#7a5a2e;
  --A:#1f7a52; --B:#6aa55b; --C:#d39b2a; --D:#9aa19d; --Q:#b7bdb9; --green:#1f7a52; --amber:#d39b2a; --red:#b5532d;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-place:"Fraunces",Georgia,"Times New Roman",serif;
  --r:14px; --shadow:0 8px 30px rgba(24,32,28,.16); --blur:saturate(1.5) blur(16px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;height:100dvh}
/* the page never scrolls: fixed to the visible area (dvh follows the phone's URL bar) */
body{position:fixed;inset:0;margin:0;font:14.5px/1.5 var(--font-ui);color:var(--ink);background:#e8ece6;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0;z-index:0;background:#e8ece6}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--solid)}}

/* top bar */
.top{position:fixed;z-index:1000;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px 16px;padding:8px 10px 8px 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand h1{margin:0;font:600 1.35rem/1.1 var(--font-place);letter-spacing:-.01em;color:var(--accent);white-space:nowrap}
.brand .tag{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchwrap{flex:1 1 220px;min-width:0;display:flex;gap:8px}
input[type=search],select{width:100%;min-width:0;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.85)}
#vv{max-width:190px}
.seg{display:flex;padding:3px;gap:2px;background:rgba(24,32,28,.06);border-radius:11px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:.84rem;color:var(--muted);font-weight:600;white-space:nowrap}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lang{display:flex;gap:2px}
.lang button{border:0;background:none;padding:4px 7px;border-radius:7px;cursor:pointer;font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.lang button.on{background:var(--ink);color:#fff}

.infobtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:10px;padding:6px 11px 6px 7px;cursor:pointer;font-size:.84rem;font-weight:600;white-space:nowrap}
.infobtn>span:first-child{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font:700 12px/18px Georgia,serif;text-align:center;font-style:italic}
.infobtn:hover{background:#fff}

/* filter strip */
.fbar{position:fixed;z-index:1000;top:calc(78px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));max-width:calc(100% - 24px);
  display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:7px 12px}
.fitem{display:flex;align-items:center;gap:8px}
.fitem .lbl{margin:0}
.pop{position:relative}
.pop>summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.85);font-size:.84rem;font-weight:600;white-space:nowrap}
.pop>summary::-webkit-details-marker{display:none}
.pop>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translate(-1px,-1px);margin-left:2px}
.pop[open]>summary{background:#fff;border-color:var(--accent);color:var(--accent)}
.panel{position:absolute;top:calc(100% + 8px);left:0;z-index:1100;min-width:250px;padding:10px 14px;background:var(--solid)}
.panel.mpanel{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));top:calc(160px + env(safe-area-inset-top,0px));min-width:0}
.side{position:fixed;z-index:900;left:calc(12px + env(safe-area-inset-left,0px));top:calc(136px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:320px;display:flex;flex-direction:column;overflow:hidden}
.side .scroll{overflow:auto;flex:1;min-height:0}
.listhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.listhead h2{margin:0}
.side .legend{margin:0;padding:8px 16px 10px;border-top:1px solid var(--line)}

/* about dialog */
.infodlg{width:min(760px,calc(100% - 24px));max-height:calc(100% - 48px);border:1px solid var(--line);border-radius:18px;padding:26px 30px 20px;background:var(--solid);color:var(--ink);box-shadow:var(--shadow)}
.infodlg::backdrop{background:rgba(24,32,28,.35);backdrop-filter:blur(2px)}
.infodlg .x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px}
.infodlg .x:hover{background:var(--hover)}
.dlgtitle{font-size:1.5rem;margin:0 0 8px;padding-right:30px}
.infodlg .lead{font-size:.95rem;line-height:1.6;margin-bottom:14px}
.infodlg h3{font:600 1.05rem/1.25 var(--font-place);margin:0 0 4px}
.infodlg .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 26px;padding:14px 0;border-top:1px solid var(--line)}
.infodlg footer{padding:12px 0 0;margin-top:14px;border-top:1px solid var(--line)}
#infoGo{margin-top:6px}
.infodlg .actions{margin-top:6px}
.fbdlg{width:min(560px,calc(100% - 24px))}
.fbsite{margin:0 0 10px;font-size:.88rem;color:var(--muted)}
.fbkinds{display:grid;gap:6px;margin:0 0 10px}
.fbkinds label{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:.9rem}
.fbkinds label:has(input:checked){border-color:var(--accent);background:var(--hover)}
.fbnote{font-size:.82rem;background:var(--sale-bg);border-left:3px solid var(--sale);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.fbl{display:grid;gap:4px;margin:0 0 10px;font-size:.84rem;font-weight:600}
.fbl textarea,.fbl input{font:inherit;font-weight:400;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.fbts{min-height:65px;margin:4px 0 6px}
.fbmsg{font-size:.88rem;font-weight:600;margin:8px 0 0}.fbmsg.ok{color:var(--accent)}.fbmsg.err{color:var(--red)}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:0 0 6px}
h2{font:600 1.05rem/1.25 var(--font-place);margin:0 0 4px;color:var(--ink)}
.small{font-size:.8rem;color:var(--muted)}
details.intro summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.intro summary::-webkit-details-marker{display:none}
details.intro summary::after{content:"+";color:var(--muted);font-size:1.1rem}
details.intro[open] summary::after{content:"–"}
.grades{display:flex;flex-wrap:wrap;gap:5px}
.gchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 6px 3px 3px;cursor:pointer;font-weight:700;font-size:.78rem;min-width:0}
.gchip .g{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.78rem}
.gchip[aria-pressed="false"]{opacity:.4;background:transparent}
.gchip .n{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.g{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:7px;color:#fff;font-weight:800;font-size:.8rem}
.gA{background:var(--A)}.gB{background:var(--B)}.gC{background:var(--C)}.gD{background:var(--D)}.gQ{background:var(--Q)}
.pill{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--accent);color:#fff;font-size:.7rem;font-weight:700;text-align:center}
.pill:empty{display:none}
.fgroup{margin:8px 0}.fh{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:3px}
#statuses label,.kfilter{display:flex;align-items:center;gap:7px;font-size:.84rem;margin:3px 0;cursor:pointer}
.dist{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dist select{width:auto;flex:1}.dist input[type=range]{flex:1 1 120px;accent-color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:.8rem;padding:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.74rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
#count{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
#list{list-style:none;margin:0;padding:4px 0}
#list li{padding:7px 16px;cursor:pointer;display:flex;gap:10px;align-items:center}
#list li:hover,#list li:focus-visible{background:var(--hover);outline:none}
#list .n{flex:1;min-width:0}
#list .nm{font-family:var(--font-place);font-weight:600;font-size:.98rem}
#list .de{color:var(--muted);font-size:.78rem;margin-left:4px}
#list .c{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
ul.inc{margin:4px 0 0;padding-left:18px;font-size:.82rem}
footer{font-size:.74rem;color:var(--muted);padding:12px 16px}
footer a,.sec a{color:var(--accent)}

/* right: the site card */
.card{position:fixed;z-index:950;right:calc(12px + env(safe-area-inset-right,0px));top:calc(136px + env(safe-area-inset-top,0px));width:350px;
  max-height:calc(100% - 148px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:16px;display:grid;gap:12px}
/* the close button stays at the top while the card scrolls */
.card .x{position:sticky;top:-8px;justify-self:end;margin:-8px -8px -40px 0;z-index:3;border:0;background:var(--solid);font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:6px 9px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card .x:hover{background:var(--hover)}
.card .place{font:600 1.45rem/1.15 var(--font-place);margin:0;padding-right:26px;text-wrap:balance}
.card .meta{font-size:.8rem;color:var(--muted);margin:2px 0 0}
.cs{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.cs:first-of-type{border-top:0;padding-top:0}
.st{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.gb{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:rgba(255,255,255,.6);display:flex;align-items:center;gap:10px}
.gb b{font-size:1.9rem;line-height:1;font-weight:800;color:var(--c)}
.gb span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;line-height:1.2}
.gb.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:#fff}
.gb .pth{display:flex;flex-direction:column;gap:1px}.gb .pth small{font-size:.74rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.lights{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.lights li{display:grid;grid-template-columns:14px 1fr;gap:2px 8px;align-items:start;font-size:.82rem;line-height:1.35}
.lights .dot{width:12px;height:12px;border-radius:50%;margin-top:3px;background:var(--lc);box-shadow:0 0 0 2px color-mix(in srgb,var(--lc) 22%,transparent)}
.lights .dot.none{background:#fff;border:2px dashed #b7bdb9;box-shadow:none}
.lights b{font-weight:700}.lights span.w{grid-column:2;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.74rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.6)}
.chips span.sale{border-color:var(--sale);color:var(--sale)}
.offer{padding:8px 10px;background:var(--sale-bg);border-left:3px solid var(--sale);border-radius:8px;font-size:.82rem}
.offer a{color:var(--sale)}
.offer svg{vertical-align:-1px;margin-right:4px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:.85rem;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:rgba(122,90,46,.1);color:var(--past)}
.btn.ghost:hover{background:rgba(122,90,46,.16)}
.btn.plain{background:rgba(24,32,28,.06);color:var(--ink)}.btn.plain:hover{background:rgba(24,32,28,.1)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1 1 auto}
.linkbox{width:100%;font-size:.78rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
#toast{position:fixed;z-index:1200;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));padding:8px 14px;font-size:.85rem;font-weight:700}
.teaser{font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

/* map markers */
.mchip{display:flex;align-items:center;gap:3px;height:26px;padding:0 8px 0 5px;border-radius:13px;background:rgba(255,255,255,.95);
  border:1.5px solid rgba(24,32,28,.14);box-shadow:0 2px 6px rgba(0,0,0,.2);font:800 12.5px/1 var(--font-ui);color:var(--c);position:relative;white-space:nowrap}
.hmark{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.92);border:1.5px solid var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
/* the chip floats above the site with a short stem, so the map's own label on the building stays readable */
.mchip::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:9px;margin-left:-1px;background:var(--c);border-radius:0 0 1px 1px}
.mchip.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent),0 2px 6px rgba(0,0,0,.2)}
.mchip .sale{position:absolute;right:-7px;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--sale);border:1.5px solid #fff;display:flex;align-items:center;justify-content:center}
.kpin{position:relative;width:16px;height:16px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 2px var(--sale)}
.kpin::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--sale);animation:kp 2s ease-out infinite}
.kbadge{position:absolute;right:-10px;top:-10px;width:15px;height:15px;border-radius:50%;background:var(--sale);border:1.5px solid #fff;display:flex;align-items:center;justify-content:center}
@keyframes kp{from{transform:scale(.8);opacity:.9}to{transform:scale(2.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.kpin::before{animation:none}}

/* then / now */
.cmp{position:fixed;z-index:940;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;font-size:.8rem;font-weight:700}
.cmp .small{font-weight:500}
.cmp .end{color:var(--past)}
/* the then/now line: a 32 px grab zone around a 3 px line with a knob; drag it anywhere along its height */
#divider{position:fixed;top:0;bottom:0;width:32px;margin-left:-16px;z-index:400;cursor:ew-resize;touch-action:none;background:transparent}
#divider::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:var(--past);box-shadow:0 0 0 1px rgba(255,255,255,.75)}
#divider .knob{position:absolute;top:50%;left:50%;width:38px;height:38px;margin:-19px;border-radius:50%;background:var(--past);border:2.5px solid #fff;
  box-shadow:0 3px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:#fff;font:700 15px/1 var(--font-ui);letter-spacing:-1px;transition:transform .12s}
#divider:hover .knob,#divider.drag .knob,#divider:focus-visible .knob{transform:scale(1.12)}
#divider:focus-visible{outline:none}
#divider:focus-visible .knob{box-shadow:0 0 0 3px rgba(122,90,46,.45),0 3px 10px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){#divider .knob{transition:none}}

/* leaflet chrome in the same style */
.leaflet-control-layers,.leaflet-bar{border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:var(--shadow)!important;overflow:hidden}
.leaflet-control-layers{background:var(--glass)!important;backdrop-filter:var(--blur)}
.leaflet-bar a{background:var(--glass);backdrop-filter:var(--blur);color:var(--ink)}
.leaflet-control-attribution{background:rgba(255,255,255,.75)!important;border-radius:8px 0 0 0;font-size:10.5px}
.leaflet-bottom.leaflet-right{margin-right:calc(env(safe-area-inset-right,0px));transition:margin-right .2s}
/* an open card (350 px wide, up to the bottom) would cover zoom and layer switch: move them to its left */
body:has(#card:not([hidden])) .leaflet-bottom.leaflet-right{margin-right:calc(362px + env(safe-area-inset-right,0px))}
.leaflet-top.leaflet-left{display:none}

/* phones: top bar stacks, list and card become bottom sheets */
.sheetbtn{display:none}
@media (max-width:760px){
  body{font-size:14px}
  .top{top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));padding:8px 10px;gap:8px}
  .brand{flex:1 1 auto}.brand .tag{display:none}
  .searchwrap{flex:1 1 100%;order:3}#vv{display:none}
  .infobtn [data-t]{display:none}.infobtn{padding:6px}
  .fbar{top:calc(112px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));max-width:none;
    flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:6px 8px;gap:8px}
  .fbar .lbl{display:none}
  .fbar{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:36px}
  .side:not(.open) .legend{display:none}

function buyUrl(id){
  if(!C.checkout) return C.email ? `mailto:${C.email}?subject=Dossier%20${id}` : "#";
  return C.checkout + (C.checkout.includes("?")?"&":"?") + "checkout[custom][dossier]=" + encodeURIComponent(id)
         + "&checkout[locale]=" + lng;
}

// the manor's state as an icon: house, broken walls, dashed outline, question mark
function icon(status, col, px){
  const p = {standing:`<path d="M3 20V10.5L12 4l9 6.5V20z" fill="${col}"/><rect x="10" y="13.5" width="4" height="6.5" fill="#fff" opacity=".9"/>`,
    ruin:`<path d="M3 20v-8.5L6.5 8l2 3.5L11 6.5l2 4L15.5 8 18 11l3-1v10z" fill="${col}"/>`,
    lost:`<path d="M4 19.5v-8.7L12 5l8 5.8v8.7z" fill="none" stroke="${col}" stroke-width="2.2" stroke-dasharray="3.2 2.4"/>`,
    unknown:`<circle cx="12" cy="12" r="8.5" fill="none" stroke="${col}" stroke-width="2.2"/><text x="12" y="16.3" text-anchor="middle" font-size="12" font-weight="800" fill="${col}" font-family="system-ui,sans-serif">?</text>`,
    unlocated:`<circle cx="12" cy="12" r="8" fill="none" stroke="${col}" stroke-width="2.4" stroke-dasharray="3 2.6"/>`}[status] || "";
  return `<svg viewBox="0 0 24 24" width="${px}" height="${px}" aria-hidden="true">${p}</svg>`;
}
// price tag, not a currency: neutral for a Polish state sale shown in three languages
const TAG = (fill, hole, px) => `<svg viewBox="0 0 24 24" width="${px}" height="${px}" aria-hidden="true"><path fill="${fill}" d="M3 3h8l10 10-8 8L3 11z"/><circle cx="7.5" cy="7.5" r="1.8" fill="${hole}"/></svg>`;
const zl = n => new Intl.NumberFormat(lng === "en" ? "en-GB" : lng, {maximumFractionDigits: 0}).format(n) + " zł";

// ---------------------------------------------------------------- map
const map = window.L.map("map", {preferCanvas:true, zoomControl:false}).setView([52.1, 19.2], 6);
window.L.control.zoom({position:"bottomright"}).addTo(map);
const wms = (url, layers, o={}) => window.L.tileLayer.wms(url, Object.assign({layers, format:"image/png", transparent:true, version:"1.1.1"}, o));
const ortho = wms("https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution","Raster",{transparent:false, attribution:"GUGiK / Geoportal"});
// LiDAR terrain relief: foundations, terraces, avenues and ponds of vanished manors show up under the trees
const lidar = wms("https://mapy.geoportal.gov.pl/wss/service/PZGIK/NMT/GRID1/WMS/ShadedRelief","Raster",{transparent:false, attribution:"GUGiK / Geoportal (LiDAR)"});
const osm = window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(map);
const MTB_URL = "https://pastmaps.cenagis.edu.pl/geoserver/ihpan/wms", MTB_ATTR = "IH PAN, pastmaps (CC BY-NC)";
const mtb = wms(MTB_URL,"m25k_3857",{transparent:false, attribution:MTB_ATTR});
const markers = window.L.layerGroup().addTo(map);
const kowrLayer = window.L.layerGroup().addTo(map);
function ctl(){
  if(map._ctl) map.removeControl(map._ctl);
  map._ctl = window.L.control.layers({"OpenStreetMap":osm, "Orthophoto (Geoportal)":ortho, [t("lidar")]:lidar, [t("hist")]:mtb},
                                     {[t("kowr")]:kowrLayer}, {position:"bottomright"}).addTo(map);
}

// parcel outlines of the shown sites, from zoom 14 (parcels.json is loaded on first use)
const parcelLayer = window.L.layerGroup().addTo(map);
let PARCELS = null, shownSites = [], selected = null;
function drawParcels(){
  parcelLayer.clearLayers();
  drawOfferAreas();                                    // the shown and selected sites colour their offers
  if(map.getZoom() < 14) return;
  if(PARCELS === null){
    PARCELS = {};
    fetch("parcels.json").then(r => r.ok ? r.json() : {}).then(d => { PARCELS = d; drawParcels(); }).catch(() => {});
    return;
  }
  const b = map.getBounds().pad(0.2);
  for(const s of shownSites){
    if(s.h && b.contains([s.h[0], s.h[1]])){        // the building the state rests on
      const far = houseFar(s);
      // only when it is not the site itself: there the chip's stem points at it, and a mark would hide its name
      if(far) window.L.polyline([[s.lat, s.lon], [s.h[0], s.h[1]]], {color:COL[sg(s)], weight:1.5, dashArray:"3 4", interactive:false}).addTo(parcelLayer);
      window.L.circle([s.h[0], s.h[1]], {radius: Math.max(6, Math.sqrt(s.h[2] / Math.PI) * 1.3), color:COL[sg(s)], weight:2,
        fill:false, interactive:false}).addTo(parcelLayer);
      if(far) window.L.marker([s.h[0], s.h[1]], {interactive:false, keyboard:false, icon: window.L.divIcon({className:"",
        html:`<div class="hmark" style="--c:${COL[sg(s)]}">${icon("standing", COL[sg(s)], 13)}</div>`, iconSize:[20,20], iconAnchor:[10,10]})}).addTo(parcelLayer);
    }
    const ring = PARCELS[s.id];
    // a site for sale by KOWR: the offer's parcels are its plot (drawn by drawOfferAreas), not its single parcel
    if(ring && !(s.ku && OFFERS[s.ku] && OFFERS[s.ku].pl) && b.contains([s.lat, s.lon]))
      window.L.polygon(ring, {color:COL[sg(s)], weight: s === selected ? 3 : 2, fillOpacity: s === selected ? .16 : .08, interactive:false}).addTo(parcelLayer);
  }
}

// then / now: the Messtischblatt in its own pane, clipped left of the divider
const pastPane = map.createPane("past"); pastPane.style.zIndex = 250; pastPane.style.pointerEvents = "none";
const mtbPast = wms(MTB_URL,"m25k_3857",{transparent:false, attribution:MTB_ATTR, pane:"past"});
let comparing = false, cmpFrac = .5;
function clipPast(){
  if(!comparing) return;
  const nw = map.containerPointToLayerPoint([0, 0]), size = map.getSize(), x = nw.x + size.x * cmpFrac;
  pastPane.style.clip = `rect(${nw.y}px, ${x}px, ${nw.y + size.y}px, ${nw.x}px)`;
  const dv = $("divider");
  dv.style.left = (map.getContainer().getBoundingClientRect().left + size.x * cmpFrac) + "px";
  dv.setAttribute("aria-valuenow", Math.round(cmpFrac * 100));
}
map.on("move zoom resize", clipPast);
function setCompare(on){
  comparing = on;
  if(on){ mtbPast.addTo(map); clipPast(); } else { map.removeLayer(mtbPast); pastPane.style.clip = ""; }
  $("divider").hidden = !on;
  cmpUi();
}
function cmpUi(){
  $("cmp").innerHTML = comparing
    ? `<span class="end">◂ ${esc(t("then"))}</span><span class="small">${esc(t("dragHint"))}</span><span>${esc(t("now"))} ▸</span><button class="btn ghost" id="cmpBtn" type="button" aria-label="${esc(t("cmpOff"))}" title="${esc(t("cmpOff"))}">✕</button>`
    : `<button class="btn ghost" id="cmpBtn" type="button">${icon("ruin", "currentColor", 16)} ${esc(t("cmpOn"))}</button>`;
  $("cmpBtn").onclick = () => setCompare(!comparing);
  $("divider").setAttribute("aria-label", t("dragHint"));
}
// drag the line itself (mouse, touch, pen); arrow keys move it when it has focus
(() => {
  const dv = $("divider");
  const setX = clientX => {
    const r = map.getContainer().getBoundingClientRect();
    cmpFrac = Math.min(.98, Math.max(.02, (clientX - r.left) / r.width));
    clipPast();
  };
  let dragging = false;
  dv.addEventListener("pointerdown", e => {
    e.preventDefault(); dragging = true;
    try { dv.setPointerCapture(e.pointerId); } catch(err) {}
    dv.classList.add("drag"); map.dragging.disable(); setX(e.clientX);
  });
  window.addEventListener("pointermove", e => { if(dragging) setX(e.clientX); });
  const end = () => { if(!dragging) return; dragging = false; dv.classList.remove("drag"); map.dragging.enable(); };
  window.addEventListener("pointerup", end); window.addEventListener("pointercancel", end);
  dv.addEventListener("keydown", e => {
    const step = e.shiftKey ? .1 : .02;
    if(e.key === "ArrowLeft" || e.key === "ArrowRight"){
      e.preventDefault(); cmpFrac = Math.min(.98, Math.max(.02, cmpFrac + (e.key === "ArrowLeft" ? -step : step))); clipPast();
    }
    if(e.key === "Escape") setCompare(false);
  });
})();

// KOWR offers matched to a site are shown on that site (badge + card); only unmatched ones get their own marker
const OFFERS = Object.fromEntries(D.kowr.map(o => [o.id || o.url, o]));
const MATCHED = new Set(VV.flatMap(v => v.sites.map(s => s.ku).filter(Boolean)));
const ha = x => new Intl.NumberFormat(lng === "en" ? "en-GB" : lng, {maximumFractionDigits: 2}).format(x);
const areaTxt = o => o.pl && o.pl.length
  ? t((o.pn || o.pl.length) > 1 ? "offerArea" : "offerArea1").replace("{n}", o.pn || o.pl.length).replace("{ha}", ha(o.ha || o.pha))
    + (o.pf && o.pn && o.pf < o.pn ? t("offerPartial").replace("{f}", o.pf) : "")
  : (o.ha ? ha(o.ha) + " ha" : "");
const offerHtml = o => `<div class="offer"><b>${TAG("#245b8f", "#eaf1f8", 12)}${esc(t("kowr"))}</b><br>${esc(o.t)}<br>`
  + [esc(areaTxt(o)), o.reg ? esc(t("regL")) + " " + esc(o.reg) : ""].filter(Boolean).join(" · ")
  + (o.price ? `<br><b>${esc(t("priceL"))}: ${esc(zl(o.price))}</b>${o.disc ? ` · ${esc(t("discL"))} ${o.disc} %` : ""}` : "")
  + (o.tender ? `<br>${o.past ? `<i>${esc(t("tenderPast").replace("{d}", o.tender))}</i>` : `${esc(t("tender"))}: ${esc(o.tender)}`}` : "")
  + `<br><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(t(o.src === "schedule" ? "openSchedule" : "openCard"))}</a></div>`;
// the tender area of every offer (all its parcels), dashed blue, from zoom 13; part of the KOWR overlay
const offerAreas = window.L.layerGroup().addTo(kowrLayer);
map.on("overlayadd overlayremove", e => { if(e.layer === kowrLayer) drawMarkers(); });
function drawOfferAreas(){
  offerAreas.clearLayers();
  if(map.getZoom() < 13) return;
  const b = map.getBounds().pad(.3);
  const siteOf = new Map(shownSites.filter(s => s.ku).map(s => [s.ku, s]));
  for(const o of D.kowr) if(o.pl && b.contains([o.lat, o.lon])){
    const s = siteOf.get(o.id || o.url);               // the offer is this site's plot: its grade colour, the sale's dashes on top
    for(const ring of o.pl){
      if(s) window.L.polygon(ring, {color:COL[sg(s)], weight: s === selected ? 4 : 3, fillColor:COL[sg(s)], fillOpacity: s === selected ? .16 : .08, interactive:false}).addTo(offerAreas);
      window.L.polygon(ring, {color:"#245b8f", weight:2, dashArray:"6 5", fill:!s, fillColor:"#245b8f", fillOpacity:.07, interactive:false}).addTo(offerAreas);
    }
  }
}
map.on("zoomend moveend", drawOfferAreas);
for(const o of D.kowr){
  if(MATCHED.has(o.id || o.url)) continue;
  window.L.marker([o.lat,o.lon], {title:o.t, icon: window.L.divIcon({className:"", html:`<div style="background:#245b8f;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)">${TAG("#fff", "#245b8f", 13)}</div>`, iconSize:[24,24]})})
   .on("click", () => showCard(`<p class="place">${esc(o.t)}</p>${offerHtml(o)}`))
   .addTo(kowrLayer);
}

// ---------------------------------------------------------------- the site card
let cardFor = null;                                    // [village, sites] shown in the card, redrawn on language/mode change
function showCard(html){
  const c = $("card");
  c.innerHTML = `<button class="x" type="button" aria-label="${esc(t("close"))}">×</button>` + html;
  c.hidden = false;
  c.querySelector(".x").onclick = closeCard;
  c.querySelectorAll("[data-cmp]").forEach(b => b.onclick = () => {
    const [la, lo] = b.dataset.cmp.split(",").map(Number); map.setView([la, lo], 16); setCompare(true); });
  c.querySelectorAll("[data-share]").forEach(b => b.onclick = () => shareSite(b.dataset.share, b));
  c.querySelectorAll("[data-fb]").forEach(b => b.onclick = () => openFeedback(b.dataset.fb));
}

async function shareSite(id, btn){
  const v = cardFor && cardFor[0], url = siteUrl(id);
  const title = v ? t("shareTitle").replace("{place}", v.v + (v.de ? ` (${v.de})` : "")) : document.title;
  if(navigator.share && matchMedia("(pointer:coarse)").matches){   // phones: the system share sheet
    try { await navigator.share({title, url}); return; } catch(e) { if(e.name === "AbortError") return; }
  }
  try {                                                // some browsers never answer: give up after 1.5 s
    const timeout = new Promise((_, no) => setTimeout(() => no(new Error("timeout")), 1500));
    await Promise.race([navigator.clipboard.writeText(url), timeout]);
    toast(t("copied")); return;
  } catch(e) {}

  const box = document.createElement("input");
  box.className = "linkbox"; box.value = url; box.readOnly = true; box.setAttribute("aria-label", t("share"));

const LIGHT_OF = {park:"plot",nopark:"plot",parcel_small:"plot",parcel_large:"plot",power_near:"access",power_far:"access",road_near:"access",road_far:"access",
  neighbours_near:"access",neighbours_far:"access",reserve:"rules",protected:"rules",forest:"rules",forest_db:"rules",register:"rules",free:"rules",
  town_near:"location",town_mid:"location",town_far:"location",water:"location",bldg_on:"house",bldg_none:"house",park_apart:"plot"};
const houseFar = s => Math.abs(s.h[0] - s.lat) + Math.abs(s.h[1] - s.lon) > 0.0003;   // about 25 m
function siteHtml(s){
  const chip = (k, cls="") => `<span class="${cls}">${esc(k)}</span>`;
  const tags = s.kowr ? chip(t("forSale"), "sale") : "";        // park and register are in the lights
  const W = t("why"), town = C.town || [7, 15];
  const wt = c => esc((W[c] || c).replace("{a}", town[0]).replace("{b}", town[1]));
  const L = s.L || "-----", w = s.w || [];
  const rows = LIGHTS.map((k, i) => {
    const codes = (k === "house" ? [s.status] : []).concat(w.filter(c => LIGHT_OF[c] === k));
    const lv = L[i], dot = lv === "-" ? `<span class="dot none"></span>` : `<span class="dot" style="--lc:${LC[lv]}"></span>`;
    let txt = codes.length ? codes.map(wt).join(" · ") : esc(t("unknownL"));
    if(k === "house" && s.h) txt += " · " + esc(t(houseFar(s) ? "houseMark" : "houseAt").replace("{m}", s.h[2]) + (t("houseHow")[s.h[3]] || ""));
    return `<li>${dot}<b>${esc(t("lights")[k])}</b><span class="w">${txt}</span></li>`;
  }).join("");
  let h = `<div class="cs"><div class="st">${icon(s.status, COL[sg(s)], 22)}<span>${esc(t("status")[s.status] || s.status)}</span></div>
    <div class="gb on" style="--c:${COL[s.grade]}"><b>${esc(s.grade)}</b><span class="pth">${esc(t("pathL")[s.path] || "")}${s.grade === "?" ? `<small>${esc(t("gradeQ"))}</small>` : ""}</span></div>
    <ul class="lights">${rows}</ul>`;
  if(tags) h += `<div class="chips">${tags}</div>`;
  if(s.ku && OFFERS[s.ku]) h += offerHtml(OFFERS[s.ku]);
  if(s.status === "standing" && !s.ku) h += `<div class="small">${esc(t("private"))}</div>`;  // KOWR sites are state property
  h += `<div class="actions"><button class="btn plain" type="button" data-share="${esc(s.id)}">${SHARE_ICON} ${esc(t("share"))}</button>`
    + (s.lat ? `<button class="btn ghost" type="button" data-cmp="${s.lat},${s.lon}">${icon("ruin", "currentColor", 15)} ${esc(t("onMtb"))}</button>` : "")
    + (C.feedback ? `<button class="btn plain" type="button" data-fb="${esc(s.id)}">${esc(t("fbCard"))}</button>` : "") + `</div>`;
  if(C.shop) h += `<a class="btn primary" href="${esc(buyUrl(s.id))}" target="_blank" rel="noopener">${t("buy")} ${esc(C.price)}</a><div class="small">${esc(s.id)}</div>`;
  return h + `</div>`;
}
function openCard(v, sites){

const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ł/g,"l");
const STATUSES = ["lost", "ruin", "standing", "unknown", "unlocated"];
const REFS = C.refs || {};
const toRad = d => d * Math.PI / 180;
function km(s, v, F){                                // straight-line distance to the chosen city
  if(!F.ref) return 0;
  const [la, lo] = REFS[F.ref], la2 = s.lat ?? v.lat, lo2 = s.lon ?? v.lon;
  const a = Math.sin(toRad(la2-la)/2)**2 + Math.cos(toRad(la))*Math.cos(toRad(la2))*Math.sin(toRad(lo2-lo)/2)**2;
  return 12742 * Math.asin(Math.sqrt(a));
}
function filters(){
  const status = new Set(STATUSES.filter(k => $("st_"+k).checked));
  const f = {status, kowr: $("kowrOnly").checked, park: $("parkOnly").checked,
             reg: $("regOnly").checked, ref: $("ref").value, km: +$("km").value};
  if(f.km >= 800) f.ref = "";                          // slider at the end = any distance
  f.active = (status.size < STATUSES.length) + f.kowr + f.park + f.reg + !!f.ref;
  return f;
}
let RES = [];                                          // [{v, located, approx}] after filtering
const CHIP_ZOOM = 11, CHIP_MAX = 900;
function drawMarkers(){
  markers.clearLayers();
  shownSites = [];
  const showSale = map.hasLayer(kowrLayer);
  const chips = map.getZoom() >= CHIP_ZOOM, b = map.getBounds().pad(.3);
  let nChips = 0;
  for(const r of RES){
    for(const s of r.located){
      shownSites.push(s);
      const g = sg(s), sale = s.ku && showSale;        // the "state sale offer" overlay switches the highlighting
      let m;
      if(chips && b.contains([s.lat, s.lon]) && nChips++ < CHIP_MAX){     // close up: state icon + grade
        const html = `<div class="mchip${s === selected ? " sel" : ""}" style="--c:${COL[g]}">${icon(s.status, COL[g], 17)}${g}${sale ? `<span class="sale">${TAG("#fff", "#245b8f", 9)}</span>` : ""}</div>`;
        m = window.L.marker([s.lat, s.lon], {zIndexOffset: sale ? 1000 : 0, title: r.v.v, icon: window.L.divIcon({className:"", html, iconSize:[46,26], iconAnchor:[23,42]})});
      } else if(chips){
        continue;
      } else if(sale){                               // for sale: grade colour, pulsing ring, price-tag badge
        m = window.L.marker([s.lat,s.lon], {zIndexOffset: 1000, title: OFFERS[s.ku] ? OFFERS[s.ku].t : "",
            icon: window.L.divIcon({className:"", html:`<div class="kpin" style="--c:${COL[g]}"><span class="kbadge">${TAG("#fff", "#245b8f", 9)}</span></div>`, iconSize:[20,20], iconAnchor:[10,10]})});
      } else {
        m = window.L.circleMarker([s.lat,s.lon], {radius: s === selected ? 8 : 6, color:"#fff", weight:1.5, fillColor:COL[g], fillOpacity:.95});
      }
      m.on("click", () => openCard(r.v, [s])).addTo(markers);
    }
    if(r.approx.length){                              // known only by village: a dashed ring around the village
      const best = r.approx.map(sg).sort((a, b) => rank(a) - rank(b))[0];
      window.L.circleMarker([r.v.lat, r.v.lon], {radius: 9, color:COL[best], weight:3, dashArray:"3 3", fillOpacity:0})
        .on("click", () => openCard(r.v, r.approx)).addTo(markers);
    }
  }
  drawParcels();
}

function focusVillage(r){

function render(){
  const q = norm($("q").value), vv = vvSel.value;
  const F = filters();
  // every filter narrows the result (AND): "for sale" + grade A shows the A-graded sites for sale
  const keep = (s, v) => shown.has(sg(s)) && onPath(s) && F.status.has(s.status) && (!F.kowr || s.ku) && (!F.park || s.park)
                         && (!F.reg || s.registered) && (!F.ref || km(s, v, F) <= F.km);
  const list = VV.filter(v => v.sites.some(s => keep(s, v)) && (!vv || v.vv===vv) && (!q || norm(v.v).includes(q) || norm(v.de).includes(q)));
  RES = list.map(v => { const sites = v.sites.filter(s => keep(s, v));
    return {v, located: sites.filter(s => s.lat), approx: sites.filter(s => !s.lat)}; });
  const n = RES.reduce((a, r) => a + r.located.length + r.approx.length, 0);
  drawMarkers();
  // grade chips with counts on the chosen path
  const counts = {A:0,B:0,C:0,D:0,"?":0};
  for(const v of VV) for(const s of v.sites) if(onPath(s)) counts[sg(s)]++;
  $("grades").querySelectorAll(".gchip").forEach(b => { b.querySelector(".n").textContent = counts[b.dataset.g].toLocaleString(lng); });
  $("count").textContent = `${list.length.toLocaleString(lng)} ${t("villages")} · ${n.toLocaleString(lng)} ${t("sites")}`;
  $("countShort").textContent = n.toLocaleString(lng) + " " + t("sites");
  $("nSt").textContent = STATUSES.length - F.status.size || "";
  $("nFt").textContent = F.kowr + F.park + F.reg || "";
  $("nDi").textContent = F.ref ? "1" : "";
  $("reset").hidden = !F.active;
  const ul = $("list"); ul.innerHTML = "";
  const vkm = v => Math.min(...v.sites.filter(s => keep(s, v)).map(s => km(s, v, F)));
  const vg = v => v.sites.filter(s => keep(s, v)).map(sg).sort((a, b) => rank(a) - rank(b))[0] || v.g;   // best shown grade
  const byV = new Map(RES.map(r => [r.v, r]));
  list.sort(F.ref ? (a,b) => vkm(a) - vkm(b) : (a,b) => rank(vg(a)) - rank(vg(b)) || a.v.localeCompare(b.v));
  for(const v of list.slice(0, 200)){
    const li = document.createElement("li");
    li.tabIndex = 0;
    li.innerHTML = `<span class="g ${gcls(vg(v))}">${vg(v)}</span><span class="n"><span class="nm">${esc(v.v)}</span>${v.de?`<span class="de">${esc(v.de)}</span>`:""}<br><span class="small">${esc(v.pw)}</span></span><span class="c">${F.ref ? Math.round(vkm(v)) + " km" : v.sites.filter(s => keep(s, v)).length}</span>`;
    li.onclick = () => focusVillage(byV.get(v));
    li.onkeydown = e => { if(e.key === "Enter") focusVillage(byV.get(v)); };
    ul.appendChild(li);
  }
  if(cardFor) openCard(...cardFor);
}

function fromHash(){

  const p = h.split(",");
  if(p.length >= 3 && !isNaN(+p[0])){
    map.setView([+p[0], +p[1]], +p[2]);
    if(p[3]==="messtischblatt"){ map.removeLayer(osm); map.removeLayer(ortho); mtb.addTo(map); }
    if(p[3]==="ortho"){ map.removeLayer(osm); map.removeLayer(mtb); ortho.addTo(map); }
  }
}
